server.port=8080

# Weather API configuration
weather.base.url=https://api.openweathermap.org/data/2.5
# Provide API key via environment variable named WEATHER_API_KEY
# Resolve to empty string when not set (do not hardcode key here)
weather.api.key=${WEATHER_API_KEY:}